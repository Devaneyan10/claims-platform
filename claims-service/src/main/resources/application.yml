server:
  port: 8080

spring:
  application:
    name: claims-service
  datasource:
    url: jdbc:h2:file:./data/claims-db;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
        max.block.ms: 3000   # don't hang API requests for a minute if the broker is down

app:
  kafka:
    claims-topic: claims.events
